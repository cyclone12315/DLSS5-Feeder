name: retrieve-artifact

# Temporary helper: this developer's network cannot reach GitHub's artifact blob
# storage, but git works. Download the artifact of a finished build run and push
# the add-on binaries into the branch under dist/ so they can be pulled.
# Triggered by push (this branch is not the default branch, so workflow_dispatch
# is not registered for it); dist/ commits are ignored to avoid a loop.
on:
  push:
    branches: [vulkan-work-res-poc]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  RUN_ID: '33509644145'

jobs:
  retrieve:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download the build artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Commit the artifact contents into the branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifact -type f -print
          find artifact -type f -exec cp {} dist/ \;
          ls -la dist
          git config user.name "artifact-retriever"
          git config user.email "noreply@github.com"
          git add dist
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "dist: CI-built addon binaries from run ${RUN_ID}"
          git push
